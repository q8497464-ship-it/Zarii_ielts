    <!-- Instant Theme Detection: Zero flash of unstyled theme in dark mode -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zarii_theme');
          var isDark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Inline Splash CSS (<3KB, no blocking resources, 60fps transform/opacity only) -->
    <style id="zarii-splash-styles">
      #zarii-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F7FAF8;
        color: #124F40;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1), visibility 300ms cubic-bezier(0.22, 1, 0.36, 1);
        user-select: none;
        padding: 1.5rem;
        text-align: center;
      }
      .dark #zarii-splash {
        background-color: #0B1612;
        color: #F7FAF8;
      }
      #zarii-splash.zarii-splash-fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .zarii-splash-glow {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: rgba(91, 183, 141, 0.2);
        filter: blur(28px);
        animation: zarii-glow-loop 2.4s ease-in-out infinite;
        pointer-events: none;
      }
      .zarii-splash-mark-wrap {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zarii-splash-mark {
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 2;
        animation: zarii-float-loop 2.4s ease-in-out infinite;
      }
      .zarii-splash-book-left {
        fill: #124F40;
        animation: zarii-book-draw 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .dark .zarii-splash-book-left {
        fill: #5BB78D;
      }
      .zarii-splash-book-right {
        fill: #5BB78D;
        animation: zarii-book-draw 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .zarii-splash-z {
        fill: #124F40;
        animation: zarii-z-drop 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .dark .zarii-splash-z {
        fill: #FFFFFF;
      }
      .zarii-splash-sparkle {
        fill: #5BB78D;
        transform-origin: 760px 134px;
        animation: zarii-sparkle-loop 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .zarii-splash-title {
        margin-top: 1.25rem;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: #124F40;
        animation: zarii-fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
      }
      .dark .zarii-splash-title {
        color: #FFFFFF;
      }
      .zarii-splash-subtitle {
        margin-top: 0.25rem;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #64748B;
        animation: zarii-fade-up 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.95s both;
      }
      .dark .zarii-splash-subtitle {
        color: #94A3B8;
      }
      .zarii-splash-progress-track {
        margin-top: 1.5rem;
        width: 160px;
        height: 4px;
        border-radius: 9999px;
        background: rgba(18, 79, 64, 0.1);
        overflow: hidden;
        position: relative;
      }
      .dark .zarii-splash-progress-track {
        background: rgba(255, 255, 255, 0.12);
      }
      .zarii-splash-progress-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        border-radius: 9999px;
        background: linear-gradient(90deg, #124F40 0%, #5BB78D 100%);
        animation: zarii-progress-loop 1.8s ease-in-out infinite;
      }
      .dark .zarii-splash-progress-fill {
        background: linear-gradient(90deg, #5BB78D 0%, #FFFFFF 100%);
      }
      .zarii-splash-tip-container {
        margin-top: 1.5rem;
        max-width: 400px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1rem;
      }
      .zarii-splash-tip-text {
        font-size: 13px;
        line-height: 1.5;
        font-weight: 500;
        color: #475569;
        transition: opacity 200ms ease;
      }
      .dark .zarii-splash-tip-text {
        color: #CBD5E1;
      }
      .zarii-splash-slow-box {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
        max-width: 360px;
      }
      .zarii-splash-slow-msg {
        font-size: 13px;
        font-weight: 500;
        color: #D97706;
      }
      .dark .zarii-splash-slow-msg {
        color: #FBBF24;
      }
      .zarii-splash-reload-btn {
        background: #124F40;
        color: #FFFFFF;
        border: none;
        border-radius: 10px;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 150ms ease, opacity 150ms ease;
      }
      .zarii-splash-reload-btn:hover {
        opacity: 0.9;
        transform: scale(1.02);
      }
      .dark .zarii-splash-reload-btn {
        background: #5BB78D;
        color: #0B1612;
      }

      @keyframes zarii-float-loop {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      @keyframes zarii-glow-loop {
        0%, 100% { transform: scale(0.95); opacity: 0.15; }
        50% { transform: scale(1.18); opacity: 0.35; }
      }
      @keyframes zarii-sparkle-loop {
        0%, 75%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
        85% { opacity: 1; transform: scale(1.15) rotate(45deg); }
        92% { opacity: 0.8; transform: scale(1) rotate(45deg); }
      }
      @keyframes zarii-z-drop {
        0% { opacity: 0; transform: translateY(-24px) scale(0.75); }
        70% { opacity: 1; transform: translateY(2px) scale(1.04); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes zarii-book-draw {
        0% { opacity: 0; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes zarii-progress-loop {
        0% { left: -40%; width: 35%; }
        50% { left: 30%; width: 50%; }
        100% { left: 105%; width: 35%; }
      }
      @keyframes zarii-fade-up {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        .zarii-splash-mark,
        .zarii-splash-glow,
        .zarii-splash-sparkle,
        .zarii-splash-book-left,
        .zarii-splash-book-right,
        .zarii-splash-z,
        .zarii-splash-title,
        .zarii-splash-subtitle {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
        .zarii-splash-progress-fill {
          animation: none !important;
          left: 0 !important;
          width: 60% !important;
        }
      }
    </style>

      <!-- Rotating Friendly Study Tip -->

      <!-- Slow Warning / Offline Fallback (Appears if loading exceeds 8s or offline) -->
      <div id="zarii-splash-slow-box" class="zarii-splash-slow-box">
        <p id="zarii-splash-slow-msg" class="zarii-splash-slow-msg">This is taking longer than usual...</p>
        <button type="button" class="zarii-splash-reload-btn" onclick="window.location.reload()">Reload</button>

    <!-- Script: Session & Route Check, Tip Rotation, and React Dismiss Handlers -->
    <script>
      (function() {
        var tips = [
          "Tip: Skim the passage first, then read the questions.",
          "Tip: Practise a little every day, small steps add up.",
          "Tip: In Writing, plan for 5 minutes before you start.",
          "Tip: Speak out loud when you practise, even alone.",
          "Tip: Review your mistakes, they are your fastest teachers."
        ];
        var tipEl = document.getElementById('zarii-splash-tip');
        if (tipEl) {
          var initialIdx = Math.floor(Math.random() * tips.length);
          tipEl.textContent = tips[initialIdx];
          var curIdx = initialIdx;
          setInterval(function() {
            curIdx = (curIdx + 1) % tips.length;
            tipEl.style.opacity = '0';
            setTimeout(function() {
              tipEl.textContent = tips[curIdx];
              tipEl.style.opacity = '1';
            }, 200);
          }, 2500);
        }

        // Check if splash should display based on route and session storage
        try {
          var path = window.location.pathname || '';
          var isSessionDone = false;
          try {
            isSessionDone = sessionStorage.getItem('zarii_splash_shown') === 'true';
          } catch(e) {}

          var isPublicLanding = path === '/' || path === '';
          var splash = document.getElementById('zarii-splash');
          var root = document.getElementById('root');

          if (isSessionDone || isPublicLanding) {
            if (splash) splash.style.display = 'none';
            if (root) root.removeAttribute('aria-busy');
          } else {
            try {
              sessionStorage.setItem('zarii_splash_shown', 'true');
            } catch(e) {}
            window.__zarii_splash_start = Date.now();
            if (root) root.setAttribute('aria-busy', 'true');
          }
        } catch(e) {}

        // 8-second slow warning / offline message
        setTimeout(function() {
          var sp = document.getElementById('zarii-splash');
          if (sp && sp.getAttribute('data-dismissed') !== 'true') {
            var track = document.getElementById('zarii-splash-progress-track');
            var slowBox = document.getElementById('zarii-splash-slow-box');
            var slowMsg = document.getElementById('zarii-splash-slow-msg');
            if (track) track.style.display = 'none';
            if (slowBox) slowBox.style.display = 'flex';
            if (slowMsg) {
              if (typeof navigator !== 'undefined' && !navigator.onLine) {
                slowMsg.textContent = 'You seem to be offline. Zarii works offline after the first load.';
              } else {
                slowMsg.textContent = 'This is taking longer than usual...';
              }
            }
          }
        }, 8000);

        // Expose dismiss function for React
        window.__dismissZariiSplash = function() {
          try {
            var sp = document.getElementById('zarii-splash');
            if (!sp || sp.getAttribute('data-dismissed') === 'true') return;
            sp.setAttribute('data-dismissed', 'true');
            var elapsed = window.__zarii_splash_start ? (Date.now() - window.__zarii_splash_start) : 1000;
            var waitMs = Math.max(0, 600 - elapsed);
            setTimeout(function() {
              sp.classList.add('zarii-splash-fade-out');
              var rt = document.getElementById('root');
              if (rt) rt.removeAttribute('aria-busy');
              setTimeout(function() {
                if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
              }, 300);
            }, waitMs);
          } catch(e) {
            var sp2 = document.getElementById('zarii-splash');
            if (sp2 && sp2.parentNode) sp2.parentNode.removeChild(sp2);
          }
        };
      })();
    </script>

    <div id="root" class="min-h-screen w-full m-0 p-0"></div>
    <script type="module" src="/src/main.tsx"></script>
